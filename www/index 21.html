<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Dom Stroy</title>
<style>
:root{--bg:#F2F3F5;--sf:#FFFFFF;--ink:#1F2328;--mute:#626B74;--line:#DADDE2;--pri:#E64A21;--brand:#F04E27;--onp:#FFFFFF;--psoft:#FDEAE4;
 --amb:#E5A800;--asoft:#FFF6D6;--ok:#2E7D32;--neg:#C62828;--nsoft:#FCECEC;--pos:#2E7D32;--gsoft:#E8F4E9;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--sf:#1C1F23;--ink:#ECEEF0;--mute:#9AA1A8;--line:#2D3238;--pri:#FF6A3D;--brand:#FF6A3D;--onp:#1A0A04;--psoft:#3A2018;
 --amb:#F2C230;--asoft:#3A3112;--ok:#7BD389;--neg:#FF8A80;--nsoft:#3A1F1F;--pos:#7BD389;--gsoft:#1C3322;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom));min-height:100vh}
body.hasbot{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;padding:0}
button:disabled{opacity:.55}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
input,select{font:inherit;width:100%;height:48px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--psoft)}
input::placeholder{color:var(--mute)}

/* ---- App bar ---- */
header{position:sticky;top:0;z-index:5;background:var(--sf);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:2px;min-height:58px;padding:0 6px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:active{background:var(--bg)}
.ttl{flex:1;min-width:0;padding:0 6px}
.ttl b{display:block;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;margin-left:4px;border-radius:21px;background:var(--pri);color:var(--onp);font-weight:700;font-size:15px;flex:none}
.act:active{filter:brightness(.9)}
.act svg{width:20px;height:20px}
@media (max-width:380px){.act:not(.icon) svg{display:none}.act:not(.icon){padding:0 14px}}
.act.icon{position:relative;width:46px;height:46px;padding:0;margin-right:4px;justify-content:center;border-radius:50%}
.act.icon svg{width:24px;height:24px}
.act.icon #actT{display:none}
.act.icon .badge{position:absolute;top:-5px;right:-5px;box-shadow:0 0 0 2px var(--sf)}
.act.busy svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pav{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:none}
.pav .av{width:38px;height:38px;font-size:14px;background:var(--pri);color:var(--onp)}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--amb);color:#231700;font-size:13px;font-weight:800;display:inline-grid;place-items:center}
.tools{padding:0 12px}
.tools>*{margin-bottom:10px}
.sline{display:flex;gap:8px}
.srch{position:relative;flex:1;min-width:0}
.addb{flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:12px;border:2px solid var(--pri);color:var(--pri)}
.addb svg{width:26px;height:26px;stroke-width:3}
.addb.on{background:var(--pri);color:var(--onp)}
.srch svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--mute)}
.srch input{padding-left:42px}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--bg)}
.seg button{flex:1;min-width:0;height:46px;line-height:1.15;border-radius:9px;font-size:14px;font-weight:600;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.seg button.on{background:var(--sf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg .c{display:block;font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;opacity:.8}
.tools>.colh{margin-bottom:6px}
/* Kirish: 1-qadam foydalanuvchi plitkalari, 2-qadam parol */
.lh{font-size:20px;font-weight:700;margin:0 2px 12px}
#lufw{margin-bottom:12px}
.ugrid{background:var(--sf);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.ut{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:10px 10px 10px 14px;text-align:left;border-bottom:1px solid var(--line)}
.ut:last-child{border-bottom:0}
.ut:active{background:var(--psoft)}
.av{display:grid;place-items:center;border-radius:50%;background:var(--psoft);color:var(--pri);font-weight:800;flex:none}
.ut .av{width:42px;height:42px;font-size:15px}
.ut .tx{flex:1;min-width:0}
.ut .un{display:block;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ut .lst{display:block;font-size:12px;font-weight:600;color:var(--pri);margin-top:1px}
.ut .go{color:var(--mute);width:22px;height:22px}
.ut.last .av{background:var(--pri);color:var(--onp)}
.chg{display:inline-flex;align-items:center;gap:2px;height:40px;margin-left:-6px;color:var(--pri);font-weight:600;font-size:15px}
.chg svg{width:22px;height:22px}
.me{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.me .av{width:48px;height:48px;font-size:17px;background:var(--pri);color:var(--onp)}
.me b{font-size:19px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ld{position:absolute;left:0;right:0;bottom:-1px;height:3px;overflow:hidden}
.ld i{position:absolute;top:0;height:100%;width:40%;background:var(--pri);animation:ld 1s ease-in-out infinite}
@keyframes ld{from{left:-40%}to{left:100%}}
@media (prefers-reduced-motion:reduce){.ld i{animation:none;left:0;width:100%;opacity:.5}}

#meta:empty{min-height:0;padding:4px 0}
#meta{padding:8px 16px 6px;min-height:34px;font-size:14px;color:var(--mute)}
#meta.e{color:var(--neg);font-weight:600}
main{padding:0 12px}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* ---- Tovar kartasi ---- */
.it{--stripe:transparent;background:var(--sf);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;padding:8px 10px 8px 12px;box-shadow:inset 4px 0 0 var(--stripe)}
.it.ok{--stripe:var(--ok)}
.it.dirty{--stripe:var(--amb)}
.nm{font-weight:600;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sr{font-size:12px;color:var(--mute);margin-top:1px}
.nums,.colh{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:6px}
.nums{margin-top:6px}
.colh{padding:0 11px 0 13px;font-size:12px;font-weight:600;color:var(--mute);text-align:center}
.n b{display:flex;align-items:center;justify-content:center;height:38px;border-radius:9px;background:var(--bg);font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden}
.df.neg b{color:var(--neg);background:var(--nsoft)}
.df.pos b{color:var(--pos);background:var(--gsoft)}
.fk input{height:38px;padding:0 4px;text-align:center;font-size:18px;font-weight:700;background:var(--sf);border-width:2px;border-radius:9px}
.it.dirty .fk input{border-color:var(--amb)}
.it.dirty .fk input:focus{box-shadow:0 0 0 3px var(--asoft)}

/* ---- Hujjatlar ro'yxati ---- */
.doc{display:block;width:100%;text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:8px}
.doc:active{background:var(--psoft)}
.dh{display:flex;align-items:baseline;gap:10px}
.dh b{font-size:18px}.dh span{margin-left:auto;font-size:14px;color:var(--mute)}
.dsk{color:var(--mute);font-size:14px;margin-top:2px}
.pb{height:6px;border-radius:3px;background:var(--bg);margin:12px 0 8px;overflow:hidden}.pb i{display:block;height:100%;background:var(--pri);border-radius:3px}
.dm{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;background:var(--asoft);color:var(--ink);font-size:13px;font-weight:600}

/* ---- Bosh sahifa ---- */
.hello{margin:22px 4px 16px;font-size:24px;font-weight:700}
.tile{display:flex;gap:16px;align-items:center;width:100%;text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.tile:active{background:var(--psoft)}
.tile .ic{width:56px;height:56px;border-radius:16px;background:var(--psoft);color:var(--pri);display:grid;place-items:center;flex:none}
.tile .ic svg{width:28px;height:28px}
.tile b{display:block;font-size:18px}.tile small{display:block;color:var(--mute);font-size:14px;margin-top:2px}

.ph{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.ph .av{width:52px;height:52px;font-size:18px;background:var(--pri);color:var(--onp)}
.ph b{display:block;font-size:18px}.ph small{display:block;color:var(--mute);font-size:13px}
.biorow{display:flex;align-items:center;gap:14px;background:var(--bg);border-radius:14px;padding:12px 14px}
dialog label.biorow{display:flex;margin:0;color:var(--ink);font-size:16px;font-weight:400}
.biorow .ic{width:44px;height:44px;border-radius:12px;background:var(--psoft);color:var(--pri);display:grid;place-items:center;flex:none}
.biorow .bt{flex:1;min-width:0}.biorow b{display:block;font-size:15px}.biorow small{display:block;color:var(--mute);font-size:13px}
.sw{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none;margin:0;padding:0;border:0;transition:background .2s}
.sw::before{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw:checked{background:var(--pri)}.sw:checked::before{transform:translateX(20px)}
.sw:focus{box-shadow:none}
.pad .fn.bio{color:var(--pri)}.pad .fn.bio svg{width:34px;height:34px}
/* ---- Sanalganlar (kunlik) ---- */
h2{font-size:15px;font-weight:700;color:var(--mute);margin:22px 4px 10px}
.cl{display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:10px 6px 10px 14px;margin-bottom:6px}
.cl div{flex:1;min-width:0}.cl .nm{-webkit-line-clamp:1}
.cl small{display:block;color:var(--mute);font-size:13px}
.cl .neg{color:var(--neg);font-weight:700}.cl .pos{color:var(--pos);font-weight:700}

/* ---- Kirish ---- */
#login{padding:0;min-height:100vh;background:var(--sf)}
.hero{position:relative;padding:calc(48px + env(safe-area-inset-top)) 24px 4px;text-align:center}
.hero .ib{position:absolute;top:calc(8px + env(safe-area-inset-top));right:8px;color:var(--mute)}
.hero .wm{display:block;width:min(56vw,220px);margin:0 auto}
.hero .tg{display:block;width:min(45vw,178px);margin:8px auto 0}
.hero p{margin:12px 0 0;color:var(--mute);font-size:14px}
#login.s2 .hero{padding-top:calc(22px + env(safe-area-inset-top))}
#login.s2 .hero .wm{width:min(34vw,124px)}
#login.s2 .form{margin-top:8px}
#login.s2 #lerr:empty{min-height:0;margin-top:4px}
#login.s2 .hero .tg,#login.s2 .hero p{display:none}
/* Klaviatura ochilib ekran pasayganda parol oynasi ixchamlashadi: Kirish tugmasi ko'rinib turadi */
@media (max-height:560px){#login.s2 .hero{padding-top:calc(12px + env(safe-area-inset-top));min-height:44px}#login.s2 .hero .wm{display:none}
 #login.s2 .form{margin-top:0}#login.s2 .me{flex-direction:row;justify-content:center;gap:12px;margin:0 0 2px}#login.s2 .me .av{width:44px;height:44px;font-size:16px}#login.s2 .me b{font-size:18px}
 #login.s2 #lerr{min-height:0;margin-top:6px}}
.form{position:relative;margin:18px 16px 0;padding:0 0 24px}
.form label{display:block;font-size:14px;font-weight:600;color:var(--mute);margin:14px 0 6px}
.form label:first-child{margin-top:0}
.pw{position:relative}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);margin:0!important}
.pw input{height:56px;padding-right:104px;font-size:22px;letter-spacing:3px;text-align:left}
.pw input::placeholder{font-size:16px;letter-spacing:0}
.pw .tg{position:absolute;top:4px;bottom:4px;display:grid;place-items:center;border-radius:9px;color:var(--mute);font-weight:700;font-size:13px}
.pw .kb{right:52px;width:48px;background:var(--sf);border:1.5px solid var(--line)}
.pw .eye{right:4px;width:44px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 16px}
.pad button{height:58px;border-radius:16px;background:var(--bg);color:var(--ink);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;display:grid;place-items:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pad button:active{background:var(--psoft);color:var(--pri);transform:scale(.97)}
.pad .fn{background:transparent;font-size:15px;color:var(--mute)}
.pad .fn svg{width:28px;height:28px}
@media (max-height:700px){.pad button{height:50px;font-size:24px}.pad{gap:8px}}
.pw input[readonly]{caret-color:transparent}
.pw input.bad{border-color:var(--neg);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@media (prefers-reduced-motion:reduce){.pw input.bad{animation:none}}
#lerr{min-height:22px;margin-top:10px;font-size:14px;color:var(--neg);font-weight:600}
#lerr.i{color:var(--mute);font-weight:400}
.big{width:100%;height:54px;border-radius:14px;background:var(--pri);color:var(--onp);font-weight:700;font-size:17px;margin-top:6px}

/* ---- Pastki panel, snackbar, dialog ---- */
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--sf);border-top:1px solid var(--line)}
#bottom button{width:100%;height:52px;border-radius:14px;background:var(--ink);color:var(--sf);font-weight:700;font-size:16px}
body.kb #bottom{display:none!important}
#snack{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:9;display:flex;align-items:center;gap:10px;
 padding:12px 8px 12px 16px;border-radius:12px;background:var(--ink);color:var(--sf);font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
body.hasbot #snack{bottom:calc(86px + env(safe-area-inset-bottom))}
body.kb #snack{bottom:12px}
#snack.e{background:var(--neg);color:#fff}
#snack span{flex:1}
#snack button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:inherit}
#snack button svg{width:20px;height:20px}
dialog{border:0;border-radius:20px;padding:22px 20px 18px;width:min(92vw,400px);background:var(--sf);color:var(--ink)}
dialog::backdrop{background:rgba(10,15,20,.55)}
dialog h3{margin:0 0 8px;font-size:19px}
dialog p{margin:0;color:var(--mute)}
dialog label{display:block;font-size:14px;font-weight:600;color:var(--mute);margin:14px 0 6px}
.dact{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.btn{height:48px;border-radius:12px;font-weight:700;font-size:16px}
.btn.p{background:var(--pri);color:var(--onp)}
.btn.s{background:var(--bg);color:var(--ink)}
.btn.d{color:var(--neg)}
.hint{font-size:13px;color:var(--mute);margin:12px 0 0}
/* ---- Ochilish (splash): logotip chapdan o'ngga ochiladi ---- */
#splash{position:fixed;inset:0;z-index:50;background:var(--sf);display:grid;place-items:center;transition:opacity .45s ease}
#splash.gone{opacity:0;pointer-events:none}
#splash .in{width:min(78vw,320px)}
#splash .wm{display:block;width:100%;clip-path:inset(0 100% 0 0);animation:wipe 1.15s cubic-bezier(.65,0,.35,1) .2s forwards}
#splash .tg{display:block;width:82%;margin:12px auto 0;opacity:0;transform:translateY(6px);animation:rise .5s ease-out 1.25s forwards}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes rise{to{opacity:1;transform:none}}

/* Telefonda (APK) so'rov Android'ning o'zi orqali yuboriladi (CapacitorHttp): brauzer cheklovlari
   (CORS, http/https aralashuvi) to'sqinlik qilmaydi. Brauzerda oddiy fetch ishlatiladi. */
function nativeHttp(){const C=window.Capacitor;return C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.CapacitorHttp||null}
async function http(U,o,h){const N=nativeHttp();
 if(!N)return fetch(U,{...o,headers:h});
 let data;if(o.body){try{data=JSON.parse(o.body)}catch(e){data=o.body}}
 const r=await N.request({url:U,method:o.method||"GET",headers:h,data,connectTimeout:15000,readTimeout:60000});
 return{status:r.status,ok:r.status>=200&&r.status<300,json:async()=>{const d=r.data;if(d==null||d==="")return null;return typeof d==="string"?JSON.parse(d):d}}}
async function api(p,o={},auth){
 const a=auth||sess,h={"ngrok-skip-browser-warning":"1",...(o.headers||{})};
 if(a&&a.u)h.Authorization="Basic "+btoa(unescape(encodeURIComponent(a.u+":"+(a.p||""))));
 const U=LS.g("root",ROOT)+p;let r;busy(1);
 try{
  try{r=await http(U,o,h)}catch(e){throw new Error("Serverga ulanib bo'lmadi. Internetni tekshiring."+(e&&e.message?" ("+String(e.message).slice(0,120)+")":""))}
  if(r.status===401){if(!auth&&sess)setTimeout(()=>logout("Sessiya tugadi yoki parol o'zgargan. Qayta kiring."),0);throw new Error("Login yoki parol noto'g'ri.")}
  const j=await r.json().catch(()=>null);
  if(!r.ok)throw new Error((j&&j.error?j.error:"Server xatosi "+r.status+".").slice(0,300));
  if(j===null)throw new Error("Server kutilmagan javob qaytardi. Sozlamadagi manzilni tekshiring.");
  return j;
 }finally{busy(-1)}
}

$("q").oninput=()=>{clearTimeout(tm);tm=setTimeout(go,400)};
$("q").onkeydown=e=>{if(e.key==="Enter"){clearTimeout(tm);e.target.blur();go()}};
$("rf").onclick=()=>scr==="kl"?loadDocs():go();
$("bi").onclick=openIk;
$("bk").onclick=loadDocs;
$("out").onclick=()=>{if(!sess)return;$("profAv").textContent=ini(sess.name);$("profNm").textContent=sess.name;$("profLg").textContent="Login: "+sess.u;drawBioRow();$("prof").showModal()};
$("profX").onclick=()=>$("prof").close();
$("profOut").onclick=()=>{$("prof").close();logout("")};
function onBack(){
 const op=document.querySelector("dialog[open]");if(op){op.close();return}
 if(scr==="kd")return leaveDoc();
 if(scr==="ik"||scr==="kl"){meta("");return show("home")}
 if(scr==="login"&&lstep===2&&users.length>1){$("lpw").blur();lmsg("");return lstepTo(1)}
 if(Date.now()-lastBack<2000){const P=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;if(P&&P.exitApp)P.exitApp()}
 else{lastBack=Date.now();snack("Chiqish uchun yana bir marta bosing")}}
const CAP=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;
if(CAP&&CAP.addListener)CAP.addListener("backButton",onBack);
$("back").onclick=onBack;

/* ---------- Kirish ---------- */
function lmsg(t,info){$("lerr").textContent=t||"";$("lerr").className=info?"i":""}
let users=[],selU=null,lstep=1;
const ini=n=>String(n).trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase();
function lstepTo(n){lstep=n;$("st1").hidden=n!==1;$("st2").hidden=n!==2;$("lgo").hidden=n!==2;$("pad").hidden=n!==2||!$("lpw").readOnly;$("login").classList.toggle("s2",n===2)}
function drawUsers(){const f=$("luf").value.trim().toLowerCase(),lastU=LS.g("lastU","");
 const l=f?users.filter(x=>x.name.toLowerCase().includes(f)||x.login.toLowerCase().includes(f)):users;
 $("lul").innerHTML=l.length?l.map(x=>{const last=x.login===lastU;
  return `<button class="ut${last?" last":""}" role="listitem" data-l="${esc(x.login)}"><span class="av">${esc(ini(x.name))}</span><span class="tx"><span class="un">${esc(x.name)}</span>${last?'<span class="lst">Oxirgi kirgan</span>':""}</span><svg class="go" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>`}).join("")
  :`<div class="empty" style="padding:18px">«${esc($("luf").value.trim())}» bo'yicha foydalanuvchi topilmadi</div>`}
/* Foydalanuvchi tanlangach parol qadamiga o'tiladi va raqamli klaviatura darhol ochiladi */
function pick(u,focus){selU=u;$("meAv").textContent=ini(u.name);$("meNm").textContent=u.name;$("me").hidden=false;
 $("lut").hidden=true;$("lutL").hidden=true;$("lchg").hidden=users.length<2;$("lpw").value="";lmsg("");pwKb("numeric");lstepTo(2);drawPad()}
$("lul").onclick=e=>{const b=e.target.closest("button[data-l]");if(!b)return;const u=users.find(x=>x.login===b.dataset.l);if(u){pick(u,true);if(u.login===bioUser())bioLogin()}};
$("lchg").onclick=()=>{$("lpw").blur();lmsg("");$("luf").value="";drawUsers();lstepTo(1)};
$("luf").oninput=drawUsers;
/* Qidiruvda Enter: bitta natija qolsa, o'sha foydalanuvchi tanlanadi */
$("luf").onkeydown=e=>{if(e.key!=="Enter")return;e.preventDefault();const b=$("lul").querySelectorAll("button[data-l]");
 if(b.length===1){const u=users.find(x=>x.login===b[0].dataset.l);if(u)pick(u,true)}else $("luf").blur()};
async function loadUsers(msg){
 const svc={u:LS.g("usr",DEF_USR),p:LS.g("pwd",DEF_PWD)},lastU=LS.g("lastU","");
 users=[];selU=null;$("luf").value="";$("lufw").hidden=true;$("lul").innerHTML="";lstepTo(1);
 if(!svc.u)return manual(lastU,msg||"Foydalanuvchilar ro'yxati sozlanmagan. Loginni qo'lda yozing.");
 lmsg("Foydalanuvchilar yuklanmoqda...",1);
 try{const l=await api("foydalanuvchilar",{},svc);
  if(!l.length)return manual(lastU,msg||"Foydalanuvchilar ro'yxati bo'sh. Loginni qo'lda yozing.");
  const last=l.find(x=>x.login===lastU);users=last?[last,...l.filter(x=>x!==last)]:l;
  $("lufw").hidden=users.length<2;drawUsers();lmsg(msg||"");
  if(users.length===1){pick(users[0],false);lmsg(msg||"")}}
 catch(e){manual(lastU,msg||"Ro'yxat olinmadi: "+e.message+" Loginni qo'lda yozing.")}}
function manual(v,msg){users=[];selU=null;$("me").hidden=true;$("lchg").hidden=true;$("lut").hidden=false;$("lutL").hidden=false;$("lut").value=v||"";lstepTo(2);lmsg(msg)}
async function login(viaBio){
 viaBio=viaBio===true;
 const man=!$("lut").hidden,u=man?$("lut").value.trim():(selU&&selU.login),p=$("lpw").value;
 if(!u)return lmsg(man?"Loginni yozing.":"Foydalanuvchini tanlang.");
 const name=man?u:selU.name;
 $("lgo").disabled=true;lmsg("Tekshirilmoqda...",1);
 try{const l=await api("skladlar",{},{u,p});
  sess={u,p,name};LS.s("lastU",u);$("lpw").value="";lmsg("");fillSk(l);
  $("hello").textContent="Salom, "+name.split(" ")[0];$("pavI").textContent=ini(name);show("home");bioAfterLogin(viaBio)}
 catch(e){const i=$("lpw");i.value="";
  if(viaBio&&/parol/i.test(e.message)){await bioForget();drawPad();lmsg("1C'da parol o'zgargan. Yangi parol bilan kiring, barmoq izi qayta yoqiladi.");return}
  lmsg(e.message);i.classList.remove("bad");void i.offsetWidth;i.classList.add("bad")}
 finally{$("lgo").disabled=false}}
function logout(msg){sess=null;cur=null;$("sk").innerHTML="";$("lpw").value="";pwKb("numeric");show("login");lmsg(msg||"");loadUsers(msg)}
$("lgo").onclick=()=>login();
$("lpw").onkeydown=e=>{if(e.key==="Enter")login()};
/* Parol: ilovaning o'z raqamli tugmalari (tizim klaviaturasi kerak emas).
   Parolda harf bo'lsa "ABC" bosiladi: tizim klaviaturasi ochiladi; "123" yana tugmalarga qaytaradi. */
function pwKb(m){const i=$("lpw"),num=m==="numeric";
 i.readOnly=num;i.inputMode=num?"none":"text";i.setAttribute("inputmode",num?"none":"text");
 $("lkb").textContent=num?"ABC":"123";$("pad").hidden=!num||lstep!==2;if(num)i.blur()}
pwKb("numeric");
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};
function padKey(k){if(k==="bio")return bioLogin();const i=$("lpw");i.classList.remove("bad");
 if(k==="del")i.value=i.value.slice(0,-1);else if(k==="clr")i.value="";else i.value+=k;
 if(k!=="clr"||i.value==="")lmsg("")}
$("pad").addEventListener("pointerdown",e=>{const b=e.target.closest("button[data-k]");if(!b)return;e.preventDefault();buzz();padKey(b.dataset.k)});
$("pad").addEventListener("click",e=>{if(e.detail===0){const b=e.target.closest("button[data-k]");if(b)padKey(b.dataset.k)}}); /* klaviatura/ekran o'quvchi uchun */
/* Kompyuter klaviaturasidan ham raqam yozish mumkin */
document.addEventListener("keydown",e=>{if(scr!=="login"||lstep!==2||!$("lpw").readOnly||e.target.id==="lut")return;
 if(/^[0-9]$/.test(e.key)){padKey(e.key);e.preventDefault()}else if(e.key==="Backspace"){padKey("del");e.preventDefault()}else if(e.key==="Enter"){login();e.preventDefault()}});
/* Tugmalarga bosilganda parol maydoni fokusni yo'qotmasin */
["lkb","leye"].forEach(id=>{$(id).addEventListener("pointerdown",e=>e.preventDefault());$(id).addEventListener("mousedown",e=>e.preventDefault())});
const caretEnd=i=>{try{const n=i.value.length;i.setSelectionRange(n,n)}catch(e){}};
$("lkb").onclick=()=>{const i=$("lpw");if(i.readOnly){pwKb("text");i.focus();caretEnd(i)}else pwKb("numeric")};
$("leye").onclick=()=>{const i=$("lpw"),had=document.activeElement===i;i.type=i.type==="password"?"text":"password";
 $("leye").setAttribute("aria-label",i.type==="password"?"Parolni ko'rsatish":"Parolni yashirish");if(had){i.focus();caretEnd(i)}};

/* ---------- Sozlamalar (faqat kirish oynasida, PIN bilan) ---------- */
/* Sozlamalar yashirin: kirish oynasidagi logotipni 2 soniya bosib turing (keyin PIN so'raladi) */
function openCfg(){$("lp").value="";$("lp").placeholder="";$("lk").showModal();setTimeout(()=>$("lp").focus(),50)}
(()=>{const w=document.querySelector("#login .hero .wm");let t=null;const stop=()=>{clearTimeout(t);t=null};
 w.addEventListener("pointerdown",()=>{stop();t=setTimeout(()=>{t=null;buzz();openCfg()},2000)});
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>w.addEventListener(ev,stop));
 w.addEventListener("contextmenu",e=>e.preventDefault());w.draggable=false;w.style.webkitTouchCallout="none";w.style.userSelect="none"})();
$("lno").onclick=()=>$("lk").close();
const lok=()=>{if($("lp").value===PIN){$("lk").close();
  $("root").value=LS.g("root",ROOT);$("usr").value=LS.g("usr",DEF_USR);$("pwd").value=LS.g("pwd",DEF_PWD);$("dlg").showModal()}
 else{$("lp").value="";$("lp").placeholder="Parol noto'g'ri"}};
$("lok").onclick=lok;$("lp").onkeydown=e=>{if(e.key==="Enter")lok()};
$("no").onclick=()=>$("dlg").close();
$("ok").onclick=()=>{const r=$("root").value.trim().replace(/\/*$/,"/");LS.s("root",r==="/"?ROOT:r);LS.s("usr",$("usr").value.trim());LS.s("pwd",$("pwd").value);$("dlg").close();loadUsers()};

/* ---------- Barmoq izi / yuz bilan kirish (@capgo/capacitor-native-biometric) ----------
   Oxirgi kirgan foydalanuvchining logini va paroli telefonning himoyalangan xotirasida
   (Android Keystore) saqlanadi va faqat barmoq izi / yuz tasdiqlangandan keyin o'qiladi. */
const BIO_SRV="uz.domstroy.ombor",FP_SVG='<svg viewBox="0 0 24 24"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .13-5.35 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></svg>';
const BIO=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.NativeBiometric;
let bioOk=false;
async function bioCheck(){const B=BIO();bioOk=false;if(!B)return false;try{const r=await B.isAvailable();bioOk=!!(r&&r.isAvailable)}catch(e){}return bioOk}
const bioUser=()=>bioOk&&LS.g("bioOn","")==="1"?LS.g("bioU",""):"";
async function bioSave(u,p,name){const B=BIO();if(!B)return false;
 try{await B.setCredentials({username:u,password:p,server:BIO_SRV});LS.s("bioU",u);LS.s("bioN",name);return true}catch(e){return false}}
async function bioForget(){const B=BIO();try{if(B)await B.deleteCredentials({server:BIO_SRV})}catch(e){}LS.s("bioU","");LS.s("bioN","")}
function drawPad(){const b=$("padL"),on=!!(selU&&bioUser()&&selU.login===bioUser());
 b.dataset.k=on?"bio":"clr";b.className="fn"+(on?" bio":"");b.innerHTML=on?FP_SVG:"Tozalash";
 b.setAttribute("aria-label",on?"Barmoq izi yoki yuz bilan kirish":"Tozalash")}
let bioBusy=false;
async function bioLogin(){const B=BIO();if(!B||bioBusy||!selU||selU.login!==bioUser())return;bioBusy=true;
 try{
  try{await B.verifyIdentity({reason:"Ilovaga kirish",title:"Dom Stroy",subtitle:selU.name,description:"Barmoq izi yoki yuz orqali tasdiqlang",negativeButtonText:"Parol bilan kirish",maxAttempts:3})}
  catch(e){const c=parseInt(e&&(e.code!=null?e.code:e.errorCode),10);
   if(![10,15,16].includes(c))lmsg("Barmoq izi bilan kirib bo'lmadi. Parolni kiriting.");return}
  let cr;try{cr=await B.getCredentials({server:BIO_SRV})}catch(e){cr=null}
  if(!cr||cr.username!==selU.login){await bioForget();drawPad();return lmsg("Saqlangan ma'lumot topilmadi. Parol bilan kiring.")}
  $("lpw").value=cr.password;await login(true)}
 finally{bioBusy=false}}
/* Parol bilan kirgandan keyin: yoqilgan bo'lsa shu foydalanuvchini saqlaydi, birinchi marta esa ruxsat so'raydi */
async function bioAfterLogin(viaBio){drawBioRow();if(!bioOk||viaBio)return;
 const st=LS.g("bioOn","");
 if(st==="1"){await bioSave(sess.u,sess.p,sess.name);drawBioRow();return}
 if(st==="")setTimeout(async()=>{if(scr!=="home"||!sess)return;
  const a=await ask("Barmoq izi bilan kirish","Keyingi safar parol termasdan, barmoq izi yoki yuz orqali kirasizmi? Login va parol telefonning himoyalangan xotirasida saqlanadi.",
   [{v:1,t:"Yoqish",c:"p"},{v:0,t:"Hozir emas"}]);
  if(a===1&&sess&&await bioSave(sess.u,sess.p,sess.name)){LS.s("bioOn","1");snack("Barmoq izi bilan kirish yoqildi")}
  else if(a===0)LS.s("bioOn","0");
  drawBioRow()},400)}
function drawBioRow(){$("bioRow").hidden=!bioOk||!sess;if(!sess)return;
 const on=LS.g("bioOn","")==="1"&&LS.g("bioU","")===sess.u;$("bioSw").checked=on;
 $("bioSub").textContent=on?"Yoqilgan: keyingi safar parolsiz kirasiz":"O'chirilgan"}
$("bioSw").onchange=async()=>{if(!sess)return;
 if($("bioSw").checked){if(await bioSave(sess.u,sess.p,sess.name)){LS.s("bioOn","1");snack("Barmoq izi bilan kirish yoqildi")}else{snack("Yoqib bo'lmadi. Telefonda barmoq izi yoki yuz sozlanganini tekshiring.",1)}}
 else{await bioForget();LS.s("bioOn","0");snack("Barmoq izi bilan kirish o'chirildi")}
 drawBioRow()};

show("login");
/* Ochilish animatsiyasi: ~2 soniya, ekranga bossa o'tkazib yuboriladi */
const splashDone=new Promise(res=>{const sp=$("splash");let t;const hide=()=>{clearTimeout(t);sp.classList.add("gone");setTimeout(()=>{sp.remove();res()},500)};
 const rm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
 t=setTimeout(hide,rm?700:2200);sp.addEventListener("click",hide)});
/* Ishga tushganda: barmoq izi yoqilgan bo'lsa, oxirgi foydalanuvchi tanlanadi va tasdiqlash oynasi o'zi chiqadi */
Promise.all([loadUsers(),bioCheck(),splashDone]).then(()=>{const bu=bioUser();if(!bu||scr!=="login"||sess)return;
 const u=users.find(x=>x.login===bu)||(!users.length?{login:bu,name:LS.g("bioN","")||bu}:null);
 if(!u)return;pick(u);bioLogin()});
</script></body></html>
